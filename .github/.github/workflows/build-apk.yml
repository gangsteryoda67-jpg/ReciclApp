name: Build ReciclApp APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar proyecto
        run: |
          mkdir proyecto
          unzip -q ReciclApp_para_GitHub.zip -d proyecto
          echo "Contenido:"
          find proyecto -maxdepth 3 -type f | head -100

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        working-directory: proyecto/android
        run: gradle --no-daemon assembleDebug

      - name: Renombrar APK
        run: |
          cp proyecto/android/app/build/outputs/apk/debug/app-debug.apk ReciclApp.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ReciclApp-apk
          path: ReciclApp.apk
